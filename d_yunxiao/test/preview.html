<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>dsh-yunxiao preview</title>
  <style>
    body { margin: 0; min-height: 100vh; color: #dbe7f5; background: radial-gradient(circle at 25% 20%, #1d3557, #07111f 55%); font-family: system-ui, sans-serif; }
    .host { max-width: 720px; margin: 0 540px 0 auto; padding: 72px 24px; }
    .host h1 { font-size: 42px; margin: 0 0 12px; }
    .host p { color: #91a4bd; }
  </style>
  <script>
    const previewState = {
      selectedAccountId: 'account-1',
      accounts: [{ id: 'account-1', name: '研发账号', organizationId: 'org-demo', remark: '本地预览数据', hasToken: true, selectedProject: { id: 'project-1', name: '研发中台' }, createdAt: '2026-08-24T01:00:00Z', updatedAt: '2026-08-24T01:00:00Z' }],
      dataFile: 'D:/preview/dsh-yunxiao.data.json'
    };
    const defects = [{ projectId: 'project-1', id: 'bug-1', serialNumber: 'BUG-128', subject: '登录页偶发验证码刷新失败', statusId: 'doing', statusName: '处理中', assignedToId: 'u1', assignedToName: '张三', creatorName: '李四', sprintName: 'Sprint 18', priority: 'P1', severity: '严重', gmtModified: '2026-08-24T08:25:00Z' }, { projectId: 'project-1', id: 'bug-2', serialNumber: 'BUG-127', subject: '导出报表的日期时区不正确', statusId: 'todo', statusName: '待处理', assignedToId: 'u2', assignedToName: '王五', priority: 'P2', gmtModified: '2026-08-23T13:00:00Z' }];
    const statuses = [{ id: 'todo', name: '待处理' }, { id: 'doing', name: '处理中' }, { id: 'done', name: '已完成' }];
    const pipelines = [{ id: '1001', name: '主站生产发布', status: 'SUCCESS', updateTime: 1787531400000 }, { id: '1002', name: 'API 集成测试', status: 'RUNNING', updateTime: 1787531700000 }];
    window.fetch = async (_url, options) => {
      const request = JSON.parse(options.body || '{}');
      const method = request.method;
      let data = {};
      if (method === 'state.get') data = previewState;
      else if (method === 'projects.list') data = { items: [{ id: 'project-1', name: '研发中台', selected: true }, { id: 'project-2', name: '移动客户端' }], stale: false };
      else if (method === 'defects.list') {
        const args = request.args || {};
        const items = defects.filter(item => (!args.statusId || item.statusId === args.statusId) && (!args.assignedToId || item.assignedToId === args.assignedToId));
        data = { items, total: items.length, page: 1, pageSize: 20, stale: false };
      }
      else if (method === 'defect.get') data = { defect: defects[0], description: '<p>登录页在网络抖动时，验证码可能停留在旧图片。</p><ul><li>Chrome 复现</li><li>重试后恢复</li></ul>', descriptionFormat: 'RICHTEXT', statuses, comments: [{ id: 'c1', userName: '张三', content: '<p>已定位到缓存键冲突，修复中。</p>', contentFormat: 'RICHTEXT', gmtCreate: '2026-08-24T07:30:00Z' }], attachments: [], warning: '' };
      else if (method === 'defect.statuses') data = statuses;
      else if (method === 'defect.status.update') {
        const item = defects.find(entry => entry.id === request.args.defectId);
        const status = statuses.find(entry => entry.id === request.args.statusId);
        if (item && status) { item.statusId = status.id; item.statusName = status.name; }
        data = item;
      }
      else if (method === 'pipelines.list') data = { items: pipelines, total: 2, page: 1, pageSize: 20, stale: false };
      else if (method === 'pipeline.get') data = { pipeline: pipelines[0], envName: '生产环境', sources: [{ sourceId: 's1', name: '主仓库', type: 'Codeup', repo: 'https://codeup.aliyun.com/demo/app.git', defaultBranch: 'main', isBranchMode: false }] };
      else if (method === 'pipeline.runs') data = { items: [{ pipelineId: '1001', pipelineRunId: '501', status: 'SUCCESS', startTime: '2026-08-24T07:00:00Z', endTime: '2026-08-24T07:08:00Z' }], total: 1, page: 1, pageSize: 10 };
      else if (method === 'pipeline.branches') data = [{ sourceId: 's1', name: '主仓库', type: 'Codeup', repo: 'https://codeup.aliyun.com/demo/app.git', defaultBranch: 'main', isBranchMode: false, branches: ['main', 'release/2026.08'], warning: '' }];
      return new Response(JSON.stringify({ ok: true, data }), { status: 200, headers: { 'content-type': 'application/json' } });
    };
    window.__ModuleLoader__ = { load(definition) { const plugin = definition.factory(() => ({})); plugin.apply({ effect(effect) { effect(); } }); } };
  </script>
</head>
<body>
  <main class="host"><h1>DeepSeek Harness</h1><p>云效插件本地视觉预览。工作台使用右侧独立栏，不遮挡聊天区域。</p></main>
  <script src="../dist/client.js"></script>
</body>
</html>
